name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build & package
        run: |
          wails build -platform linux/amd64 -trimpath
          ./scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: openk8s-desktop-linux
          path: |
            build/bin/*
            build/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build & package DMG
        run: |
          wails build -platform darwin/universal -trimpath
          hdiutil create -volname openk8s-desktop \
            -srcfolder "build/bin/openk8s-desktop.app" \
            -ov -format UDZO "build/bin/openk8s-desktop.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: openk8s-desktop-macos
          path: build/bin/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - name: Install NSIS
        run: choco install nsis -y
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build NSIS installer
        run: wails build -platform windows/amd64 -nsis -trimpath
      - uses: actions/upload-artifact@v4
        with:
          name: openk8s-desktop-windows
          path: build/bin/*
          if-no-files-found: error

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
