name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: '11.14.0'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build & package
        run: |
          wails build -platform linux/amd64 -trimpath
          ./scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: openk8s-desktop-linux
          path: |
            build/bin/*
            build/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: '11.14.0'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build & package
        run: |
          wails build -platform darwin/universal -trimpath
          # Universal .app as .zip (kept, Gatekeeper-friendly without signing).
          ditto -c -k --sequesterRsrc --keepParent \
            "build/bin/openk8s-desktop.app" \
            "build/bin/openk8s-desktop-macos.zip"
          # Staged .dmg build. hdiutil create -srcfolder OOMs on CI runners
          # (the whole volume is buffered in RAM): pre-allocate the volume,
          # copy into the mounted image, then convert in streaming mode.
          SIZE=$(( $(du -sk "build/bin/openk8s-desktop.app" | cut -f1) / 1024 + 64 ))
          hdiutil create -volname "OpenK8s Desktop" -size "${SIZE}m" \
            -fs HFS+ -layout SPUD "build/bin/tmp.dmg"
          hdiutil attach "build/bin/tmp.dmg" -mountpoint /Volumes/OpenK8s\ Desktop
          cp -R "build/bin/openk8s-desktop.app" /Volumes/OpenK8s\ Desktop/
          hdiutil detach /Volumes/OpenK8s\ Desktop
          hdiutil convert "build/bin/tmp.dmg" -format UDZO \
            -o "build/bin/openk8s-desktop.dmg"
          rm -f "build/bin/tmp.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: openk8s-desktop-macos
          path: build/bin/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: '11.14.0'
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          # Add NSIS to PATH for this and subsequent steps (choco does not
          # refresh the runner PATH by itself). wails needs `makensis`.
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build NSIS installer
        run: wails build -platform windows/amd64 -nsis -trimpath
      - uses: actions/upload-artifact@v4
        with:
          name: openk8s-desktop-windows
          path: build/bin/*
          if-no-files-found: error

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
